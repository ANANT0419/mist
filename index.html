<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="glass" aria-label="A pane of glass. Make a blowing face to fog it, then draw with your finger."></canvas>

<div id="brush" aria-hidden="true"></div>
<div class="hand-cursor" id="hand-0" aria-hidden="true"></div>
<div class="hand-cursor" id="hand-1" aria-hidden="true"></div>
<canvas id="debug" hidden aria-hidden="true"></canvas>
<div id="status" role="status" hidden>Show your hand</div>

<div id="mark">mist</div>
<div id="hint" role="status" aria-live="polite"></div>

<div id="pip" hidden>
  <video id="cam" playsinline muted></video>
  <div id="pip-state">Show your hand</div>
</div>

<section id="landing">
  <div class="land-card">
    <h1>mist</h1>
    <p class="land-lede">Round your lips to fog the glass.<br>Draw with your finger. Wipe with your fist.</p>
    <div class="land-buttons">
      <button id="land-solo" class="pill primary">Start</button>
    </div>
    <p class="land-foot">Your camera stays on this laptop. Nothing is recorded or sent anywhere.</p>
  </div>
</section>

<nav id="dock" aria-label="Controls">
  <div class="group">
    <button id="btn-hands" class="tool" aria-pressed="false" aria-label="Draw with your hand on camera" data-tip="Use hand on camera">
      <svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6.5 6.5 0 0 1-6.5 6.5h-1.2a6 6 0 0 1-4.6-2.2L3.6 14.8a1.6 1.6 0 0 1 2.4-2.1L8 14.5"/></svg>
    </button>
  </div>
  <span class="rule"></span>
  <div class="group seg" role="radiogroup" aria-label="Touch">
    <button id="tool-finger" class="seg-btn on" role="radio" aria-checked="true" data-tip="Finger, for drawing">Finger</button>
    <button id="tool-fist" class="seg-btn" role="radio" aria-checked="false" data-tip="Fist, for wiping (or hold Shift)">Fist</button>
  </div>
  <span class="rule"></span>
  <div class="group scenes" role="radiogroup" aria-label="Behind the glass">
    <button class="orb city on" data-scene="0" role="radio" aria-checked="true" aria-label="City at night" data-tip="City at night"></button>
    <button class="orb dusk" data-scene="1" role="radio" aria-checked="false" aria-label="Hills at dusk" data-tip="Hills at dusk"></button>
    <button class="orb aurora" data-scene="2" role="radio" aria-checked="false" aria-label="Northern lights" data-tip="Northern lights"></button>
    <button class="orb glyph" data-scene="3" role="radio" aria-checked="false" aria-label="Bathroom mirror, using your camera" data-tip="Mirror (your camera)">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="11" rx="6.5" ry="8"/><path d="M12 19v3M8.5 22h7"/></svg>
    </button>
    <button class="orb glyph" data-scene="4" role="radio" aria-checked="false" aria-label="Fog over another window or your screen" data-tip="Fog over my screen">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20.5h6M12 16.5v4"/></svg>
    </button>
  </div>
  <span class="rule"></span>
  <div class="group">
    <button id="btn-linger" class="tool" aria-label="How long fog lasts" data-tip="Fog lasts about a minute">
      <svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3v3.5c0 2 4 3.5 4 5.5s-4 3.5-4 5.5V21M16 3v3.5c0 2-4 3.5-4 5.5s4 3.5 4 5.5V21"/></svg>
    </button>
    <button id="btn-clean" class="tool" aria-label="Clean the glass" data-tip="Clean the glass (C)">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l1.7 4.6 4.6 1.7-4.6 1.7L12 16.1l-1.7-4.6L5.7 9.8l4.6-1.7zM18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8zM5.5 15.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg>
    </button>
    <button id="btn-save" class="tool" aria-label="Save a picture" data-tip="Save picture (S)">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></svg>
    </button>
    <button id="btn-sound" class="tool" aria-pressed="true" aria-label="Sound" data-tip="Sound">
      <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12.5 19V5L7.5 9.5z"/><path class="wave" d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.5a7.8 7.8 0 0 1 0 11"/></svg>
    </button>
    <button id="btn-full" class="tool" aria-label="Full screen" data-tip="Full screen (F)">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</nav>

<div id="fatal" hidden></div>

<script src="js/shaders.js"></script>
<script src="js/drops.js"></script>
<script src="js/renderer.js"></script>
<script src="js/audio.js"></script>
<script src="js/gesture.js"></script>
<script src="js/hands.js"></script>
<script src="js/face.js"></script>
<script src="js/app.js"></script>
</body>
</html>
